# Local media storage for development. The app targets this MinIO bucket through
# the S3_* settings in .env.local (STORAGE_PROVIDER=s3); ensureStorageReady()
# creates the bucket on first use. MongoDB and Redis come from the shared Docker
# instances on the host, not this file.
services:
    minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        container_name: twa-minio
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        volumes:
            - twa-minio-data:/data
        restart: unless-stopped

volumes:
    twa-minio-data:
